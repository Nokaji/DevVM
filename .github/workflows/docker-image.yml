name: Docker Image CI

on:
  push:
    branches: [ "Master" ]
  pull_request:
    branches: [ "Master" ]

jobs:
  devvmcpp:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if devvmcpp image should be built
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            devvmcpp:
              - 'DockerfileCPP'

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.devvmcpp == 'true'
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        if: steps.filter.outputs.devvmcpp == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/devvmcpp:latest
          docker build . --file DockerfileCPP --tag $IMAGE_ID

      - name: Push the Docker image
        if: steps.filter.outputs.devvmcpp == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/devvmcpp:latest
          docker push $IMAGE_ID

  devvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check if devvm image should be built
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            devvm:
              - 'Dockerfile'

      - name: Log in to GitHub Container Registry
        if: steps.filter.outputs.devvm == 'true'
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build the Docker image
        if: steps.filter.outputs.devvm == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/devvm:latest
          docker build . --file Dockerfile --tag $IMAGE_ID

      - name: Push the Docker image
        if: steps.filter.outputs.devvm == 'true'
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_ID=ghcr.io/$OWNER/devvm:latest
          docker push $IMAGE_ID
